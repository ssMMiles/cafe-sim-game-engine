
[workspace]
members = [".", "crates/engine-api", "plugins/*"]
resolver = "3"

[workspace.dependencies]
# Explicit feature list instead of bevy's defaults: the defaults pull audio
# (rodio/cpal/vorbis), gamepads (gilrs), sysinfo, a second clipboard stack,
# webgl2 shader variants, ktx2/zstd/LUTs, sprite picking, morph targets,
# and bevy_post_process — none of which this project
# uses. Each is a bevy rebuild to add back; see docs/BUILD_TIMES.md.
bevy = { version = "0.20", default-features = false, features = [
    # platform / app
    "std", "async_executor", "multi_threaded",
    "bevy_asset", "bevy_log", "bevy_state", "bevy_winit",
    "keyboard", "mouse",
    # glTF scenes spawn through bevy_world_serialization, which panics on any
    # unregistered component type (Transform was the first). Auto-registration
    # covers bevy's own types; dropping it would mean registering them by hand.
    "reflect_auto_register",
    # rendering: pbr + the pieces the camera uses (Fxaa, volumetric/distance fog)
    "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_light", "bevy_anti_alias",
    "bevy_gltf", "gltf_animation", "bevy_scene",
    # the gameplay render-target sprite, gizmos, player-facing bevy_ui
    "bevy_sprite_render", "bevy_gizmos_render",
    "bevy_ui", "bevy_ui_render", "bevy_ui_widgets", "default_font",
    # ui_picking: bevy_ui buttons; mesh_picking: `MeshRayCast`, which the
    # editor's own picker/placement/brush ray casts are built on
    "bevy_picking", "ui_picking", "mesh_picking",
    # textures the asset manifest admits
    "png", "jpeg",
    # web build (WEBGL2 is a compile-time cfg; we ship webgpu only)
    "web", "webgpu",
    # system names in spans / wgpu labels; fast incremental native link
    "debug",
    "dynamic_linking",
] }

[[bin]]
name = "game_engine"
path = "src/main.rs"

[lib]
name = "game_engine_lib"
crate-type = ["cdylib", "rlib"]

[features]
# Every feature below changes bevy's or avian's feature set and therefore
# rebuilds them. Each has its own build configuration (alias + target dir)
# in .cargo/config.toml — never pass them by hand. See docs/BUILD_TIMES.md §4.
profiling = ["bevy/trace_chrome", "bevy/sysinfo_plugin", "bevy/debug"]
opfs = []
# Web profiling: bevy's system/schedule spans become `performance.measure`
# entries (tracing-wasm), so Chrome's Performance panel shows them on the
# Timings track next to long tasks. Costs a few percent per system — measure
# stutters with it, not steady-state frame time. `tools/web-trace.mjs`
# records and summarises a run. Build: `tools/web.sh profile`.
web-profile = ["bevy/trace"]

# Build profiles — see docs/BUILD_TIMES.md for the reasoning behind each.
# There are exactly four: dev (all native work), perf (benchmarks), web-dev
# (browser iteration), release (deploys). Every build goes through one of the
# configurations in .cargo/config.toml / tools/web.sh.
[profile.dev]
opt-level = 1
# Cranelift was tried for our crates (2026-11-03) and aborts at runtime:
# glam's NEON `fmaxnmv` intrinsic is inlined into this crate and
# rustc_codegen_cranelift has no lowering for it (issue #171). Revisit when
# that lands or if glam's `scalar-math` becomes acceptable.

[profile.dev.package."*"]
opt-level = 3
# No DWARF for 680 optimised dependency crates: smaller artifacts, faster
# link of libbevy_dylib. Our own crates keep full debuginfo.
debug = false

# Deploy artifacts only (`tools/web.sh release`, CI): fat LTO + one codegen
# unit. Slow by design — never iterate on this profile.
[profile.release]
lto = true
codegen-units = 1
debug = false
strip = "debuginfo"

# Iterating on the browser build (`tools/web.sh`): thin LTO, parallel codegen.
[profile.web-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
opt-level = 2

# Optimised but not LTO'd: the ignored benchmarks
# (`cargo perf <name> -- --ignored --nocapture`).
[profile.perf]
inherits = "release"
lto = false
codegen-units = 16

[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
# getrandom needs its JS backend on wasm; bevy pulls 0.4. Listed here only to
# switch that feature on — not used directly.
getrandom = { version = "0.4.1", features = ["wasm_js"] }

# Terrain storage
rkyv = { version = "0.8", features = ["bytecheck"] }
crc32fast = "1.4"
log = "0.4.29"

# No joints anywhere in the project (the default `xpbd_joints` still ran ~500
# empty joint-solver systems per physics step), no avian picking.
# `debug-plugin` draws the editor's collider view (View ▸ Collision shapes,
# Shift+P); its systems only run while that gizmo group is enabled, and the
# bevy features it asks for (`bevy_gizmos`, `bevy_render`) are already on.
avian3d = { version = "0.8", default-features = false, features = [
    "3d", "parry-f32", "parallel", "collider-from-mesh", "bevy_scene", "debug-plugin",
] }
# Editor chrome (docked viewport, outliner, inspector). 0.43 is the Bevy 0.20
# line; egui_dock 0.21 is on the same egui (0.36). Both must always agree on
# the egui minor — see docs/EDITOR_UI_DESIGN.md §1.1 and
# docs/BEVY_0_20_UPGRADE_PLAN.md §1.
bevy_egui = { version = "0.43", default-features = false, features = [
    "render", "default_fonts", "bevy_ui", "manage_clipboard",
] }
# serde: the dock layout is persisted to editor_settings.json (user-level).
egui_dock = { version = "0.21", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Core span types for the Performance panel's per-system timing layer
# (gfx/system_timing.rs). Already in the graph via bevy; bevy_log re-exports
# tracing_subscriber but not tracing itself.
tracing = { version = "0.1", default-features = false, features = ["std"] }
rayon = "1"
bytemuck = { version = "1", features = ["derive"] }
# HDR lightmaps: OpenEXR (f16 RGB, ZIP) on disk, Rgba16Float on the GPU.
# Both crates are already in the graph via `image`; pinned to the same versions.
exr = "1.73"
half = "2.6"
engine-api = { path = "crates/engine-api" }
libloading = "0.8"
toml = "0.8"

# World bundles (File → Export world as zip): the exporter is native-only, the
# web page unpacks the archive with its own JavaScript. Reading support is
# built in; `deflate-flate2` (the flate2 already in the graph, no zopfli) is
# the only codec the bundles use.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.111"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", "Navigator", "StorageManager",
    "FileSystemDirectoryHandle", "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions", "FileSystemGetFileOptions",
    "FileSystemWritableFileStream",
    "File",
] }
js-sys = "0.3"

[dev-dependencies]
tempfile = "3"
# Validates the hand-written compute shader in a unit test (same naga Bevy
# links) so capability errors surface at `cargo test`, not at runtime.
# Keep in step with bevy_render's wgpu/naga: Bevy 0.20 -> 30.
naga = { version = "30", features = ["wgsl-in"] }
# Compiles the material shaders' WESL the way bevy's resolver does, against
# stub `bevy_pbr` modules, so `gfx/shader_check.rs` can naga-validate every
# feature combination. Keep on bevy_shader's version (Bevy 0.20 -> 0.6).
wesl = "0.6"

[dependencies.bevy]
workspace = true
