# cargo-features = ["codegen-backend"]

# [profile.dev]
# codegen-backend = "cranelift"

[[bin]]
name = "game_engine"
path = "src/main.rs"

[lib]
name = "game_engine_lib"
crate-type = ["cdylib", "rlib"]

[features]
profiling = ["bevy/trace_chrome", "bevy/sysinfo_plugin"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
opt-level = 'z'

[profile.release-native]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1

[package]
name = "cafe-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
argh = "0.1.12"
rand = { version = "0.9.0", features = [] }
getrandom = { version = "0.4.1", features = ["wasm_js"] }
# Force wasm_js/js features onto transitive getrandom versions for WASM compatibility
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom2 = { package = "getrandom", version = "0.2", features = ["js"] }
image = "0.25.6"
anyhow = "1.0.97"

bevy_modern_pixel_camera = "0.5.1"

# Terrain storage
rkyv = { version = "0.8", features = ["bytecheck"] }
crc32fast = "1.4"
winit = "0.30.12"
env_logger = "0.11.9"
log = "0.4.29"
wasm-bindgen = "0.2.111"

avian3d = { version = "0.5", features = ["debug-plugin"] }

[dev-dependencies]
tempfile = "3"

[dependencies.bevy]
version = "0.18.0"
default-features = true
features = [
    "web", "webgpu",
    "jpeg",
    # "trace_chrome",
]