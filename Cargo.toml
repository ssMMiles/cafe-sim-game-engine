cargo-features = ["codegen-backend"]

[[bin]]
name = "game_engine"
path = "src/main.rs"

[lib]
name = "game_engine_lib"
crate-type = ["cdylib", "rlib"]

[features]
profiling = ["bevy/trace_chrome", "bevy/sysinfo_plugin", "bevy/debug"]
tracy = ["bevy/trace_tracy", "bevy/debug"]
physics_debug = ["avian3d/debug-plugin"]

[profile.dev]
# codegen-backend = "cranelift"
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
# opt-level = 'z'

[profile.release-native]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1

[package]
name = "cafe-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
argh = "0.1.12"
rand = { version = "0.9.0", features = [] }
getrandom = { version = "0.4.1", features = ["wasm_js"] }
# Force wasm_js/js features onto transitive getrandom versions for WASM compatibility
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom2 = { package = "getrandom", version = "0.2", features = ["js"] }
image = "0.25.6"
anyhow = "1.0.97"

# Terrain storage
rkyv = { version = "0.8", features = ["bytecheck"] }
crc32fast = "1.4"
winit = "0.30.12"
env_logger = "0.11.9"
log = "0.4.29"
wasm-bindgen = "0.2.111"

avian3d = { version = "0.5" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", "Navigator", "StorageManager",
    "FileSystemDirectoryHandle", "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions", "FileSystemGetFileOptions",
    "FileSystemWritableFileStream",
    "File",
] }
js-sys = "0.3"

[dev-dependencies]
tempfile = "3"

[dependencies.bevy]
version = "0.18.0"
default-features = true
features = [
    "web", "webgpu",
    "jpeg",
    # "trace_chrome",
]