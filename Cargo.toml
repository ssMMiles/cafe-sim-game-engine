# cargo-features = ["codegen-backend"]

# [profile.dev]
# codegen-backend = "cranelift"

[package]
name = "cafe-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
argh = "0.1.12"
rand = { version = "0.9.0", features = [] }
getrandom = { version = "0.4.1", features = ["wasm_js"] }
image = "0.25.6"
anyhow = "1.0.97"
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"

bevy_modern_pixel_camera = "0.5.1"
bevy = { version = "0.18.0", default-features = true, features = ["debug"] }

# Terrain storage
rkyv = { version = "0.8", features = ["bytecheck"] }
crc32fast = "1.4"

[dev-dependencies]
tempfile = "3"
