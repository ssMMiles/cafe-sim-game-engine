# cargo-features = ["codegen-backend"]

[workspace]
members = [".", "crates/engine-api", "plugins/*"]
resolver = "3"

[workspace.dependencies]
bevy = { version = "0.19", default-features = true, features = [
    "web", "webgpu",
    "jpeg",
    "debug",
    "dynamic_linking",
] }

[[bin]]
name = "game_engine"
path = "src/main.rs"

[lib]
name = "game_engine_lib"
crate-type = ["cdylib", "rlib"]

[features]
profiling = ["bevy/trace_chrome", "bevy/sysinfo_plugin", "bevy/debug"]
tracy = ["bevy/trace_tracy", "bevy/debug"]
physics_debug = ["avian3d/debug-plugin"]
opfs = []

[profile.dev]
# codegen-backend = "cranelift"
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
# opt-level = 'z'

[profile.release-native]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1

[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
argh = "0.1.12"
rand = { version = "0.9.0", features = [] }
getrandom = { version = "0.4.1", features = ["wasm_js"] }
# Force wasm_js/js features onto transitive getrandom versions for WASM compatibility
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom2 = { package = "getrandom", version = "0.2", features = ["js"] }
image = "0.25.6"
anyhow = "1.0.97"

# Terrain storage
rkyv = { version = "0.8", features = ["bytecheck"] }
crc32fast = "1.4"
winit = "0.30.12"
env_logger = "0.11.9"
log = "0.4.29"
wasm-bindgen = "0.2.111"

avian3d = { version = "0.7" }
# Editor chrome (docked viewport, outliner, inspector). 0.40 is the Bevy 0.19
# line; egui_dock 0.19 is on the same egui (0.34). Both must always agree on
# the egui minor — see docs/EDITOR_UI_DESIGN.md §1.1 and
# docs/BEVY_0_20_UPGRADE_PLAN.md §1.
bevy_egui = "0.40"
egui_dock = "0.19"
rayon = "1"
bytemuck = { version = "1", features = ["derive"] }
# HDR lightmaps: OpenEXR (f16 RGB, ZIP) on disk, Rgba16Float on the GPU.
# Both crates are already in the graph via `image`; pinned to the same versions.
exr = "1.73"
half = "2.6"
engine-api = { path = "crates/engine-api" }
libloading = "0.8"
toml = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", "Navigator", "StorageManager",
    "FileSystemDirectoryHandle", "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions", "FileSystemGetFileOptions",
    "FileSystemWritableFileStream",
    "File",
] }
js-sys = "0.3"

[dev-dependencies]
tempfile = "3"
# Validates the hand-written compute shader in a unit test (same naga Bevy
# links) so capability errors surface at `cargo test`, not at runtime.
# Keep in step with bevy_render's wgpu/naga: Bevy 0.19 -> 29.
naga = { version = "29", features = ["wgsl-in"] }

[dependencies.bevy]
workspace = true
