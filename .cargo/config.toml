# Build configurations.
#
# Cargo keeps artifacts per (profile × target × feature set), and a change to
# any of those for a shared dependency means recompiling it — with bevy that
# is the whole ~20 minute cold build. The fixed configurations below give
# every feature set that touches bevy/avian its own target directory, so
# switching between them never evicts another's incremental state. Use these
# and nothing else; never pass `--features`, `--profile`, `--target` or
# `--target-dir` by hand. docs/BUILD_TIMES.md §4.
#
#   configuration     command                                   profile   dir
#   dev (default)     cargo check | test | run | build          dev       target/
#                     cargo build --workspace (plugins)         dev       target/
#   perf              cargo perf <test> -- --ignored --nocapture  perf    target/perf
#   web               tools/web.sh            (→ pkg/)          web-dev   target/web
#   web-profile       tools/web.sh profile    (→ pkg/)          web-dev   target/web-profile
#   web-release       tools/web.sh release    (→ pkg/)          release   target/web-release
#   web-check         cargo web-check                           dev       target/web
#   profiling         cargo run-profiling                       dev       target/profiling
#   static            cargo run-static | build-static | test-static  dev   target/static
#
# Profiles already get their own subdirectory, so `perf` shares `target/`
# with dev without conflict; the separate dirs exist for *feature* changes.

[alias]
build-plugins = "build --workspace --exclude engine"
perf = "test --profile perf"
web-check = "check --target wasm32-unknown-unknown --target-dir target/web"
run-profiling = "run --features profiling --target-dir target/profiling"
# Plugins linked into the binary instead of loaded as dylibs, and bevy linked
# statically (`--no-default-features` drops `dynamic`): a self-contained
# binary. Different bevy features → its own dir. docs/STATIC_PLUGINS_PLAN.md
run-static = "run --no-default-features --features static-plugins --target-dir target/static"
build-static = "build --no-default-features --features static-plugins --target-dir target/static"
test-static = "test --no-default-features --features static-plugins --target-dir target/static"

# sccache: shares compiled dependency artifacts across target dirs and
# worktrees, so a new configuration or a second worktree hits the cache for
# the ~600 dependency crates. Install: `brew install sccache`.
[build]
rustc-wrapper = "sccache"
# Parallel rustc front end (nightly). Our crate is 44k lines in one unit.
# NB: a target-specific `rustflags` table *replaces* this one rather than
# merging, so the wasm table below repeats it.
rustflags = ["-Zthreads=8"]

# LLVM lld instead of Apple's ld. Measured 2026-11-04 on this project:
# touch src/lib.rs + `cargo build` went 8.4-10.4 s -> 4.2-4.9 s, i.e. the
# edit-rebuild loop roughly halved. (Apple's ld-27037 is the new fast
# linker and mold can't emit Mach-O at all -- lld is the only alternative
# that works here, and it still wins.)
#
# **Requires `brew install lld`**; without it every native link fails with
# "unable to find library -lld". Repeats `-Zthreads=8` because a
# target-specific table *replaces* `[build].rustflags` rather than merging.
# `-fuse-ld=lld` resolves through PATH, so no machine-specific path.
# Changing this line rehashes every crate: one full rebuild per target dir.
[target.aarch64-apple-darwin]
rustflags = ["-Zthreads=8", "-Clink-arg=-fuse-ld=lld"]

[target.wasm32-unknown-unknown]
runner = "wasm-server-runner"
# `--cfg feature="opfs"` keeps the OPFS storage paths on for every wasm
# build, so no `--features opfs` is needed anywhere.
rustflags = ["--cfg", "feature=\"opfs\"", "-Zthreads=8"]

[profile.dev.package.objc2]
debug-assertions = false
