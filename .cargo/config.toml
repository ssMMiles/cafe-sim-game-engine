[alias]
build-plugins = "build --workspace --exclude engine"

# sccache: shares compiled dependency artifacts across target dirs and
# worktrees, so a second worktree's cold build hits the cache for the ~680
# dependency crates. Install: `brew install sccache`.
[build]
rustc-wrapper = "sccache"
# Parallel rustc front end (nightly). Our crate is 44k lines in one unit.
# NB: a target-specific `rustflags` table *replaces* this one rather than
# merging, so the wasm table below repeats it.
rustflags = ["-Zthreads=8"]

[target.wasm32-unknown-unknown]
runner = "wasm-server-runner"
# `--cfg feature="opfs"` keeps the OPFS storage paths on for every wasm build.
rustflags = ["--cfg", "feature=\"opfs\"", "-Zthreads=8"]

[profile.dev.package.objc2]
debug-assertions = false
